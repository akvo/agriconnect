<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriConnect — Data Flows (Proposal)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f9fa;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px;
    min-height: 100vh;
  }
  .header { text-align: center; margin-bottom: 28px; }
  .logo-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #027E5D;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .5px;
    padding: 5px 14px;
    border-radius: 100px;
    margin-bottom: 12px;
  }
  h1 { font-size: 22px; font-weight: 700; color: #014533; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #777; }
  .diagram-wrap {
    background: #fff;
    border: 1px solid #B1D7CD;
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 4px 20px rgba(2,126,93,.07);
    max-width: 720px;
    width: 100%;
  }
  @media print {
    body { background: #fff; padding: 0; }
    .header { margin-bottom: 16px; }
    .diagram-wrap { box-shadow: none; border: 1px solid #B1D7CD; padding: 16px; max-width: 170mm; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo-pill">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    AgriConnect
  </div>
  <h1>Core Data Flows</h1>
  <p class="subtitle">How messages travel through the platform</p>
</div>

<div class="diagram-wrap">
<svg viewBox="0 0 664 380" xmlns="http://www.w3.org/2000/svg" width="100%"
     style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#027E5D"/>
    </marker>
    <marker id="a2" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#014533"/>
    </marker>
    <marker id="a3" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#35987D"/>
    </marker>
    <filter id="s"><feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#027E5D" flood-opacity="0.12"/></filter>
  </defs>

  <!-- ════════════════════════════════════════
       FLOW 1 — AI REPLY
  ════════════════════════════════════════ -->
  <!-- Section label -->
  <rect x="0" y="0" width="664" height="30" rx="8" fill="#027E5D"/>
  <text x="16" y="19" font-size="10" font-weight="700" fill="#fff" letter-spacing=".3">FLOW A  ·  Farmer Question → AI Answer</text>

  <!-- Step nodes — 5 across -->
  <!-- Node helper macro: cx, cy = center -->

  <!-- 1. Farmer sends -->
  <circle cx="58" cy="82" r="20" fill="#027E5D" filter="url(#s)"/>
  <text x="58" y="78" text-anchor="middle" font-size="14">🌾</text>
  <text x="58" y="91" text-anchor="middle" font-size="8" fill="#fff" font-weight="700">Farmer</text>
  <text x="58" y="114" text-anchor="middle" font-size="8.5" fill="#555">Sends question</text>
  <text x="58" y="126" text-anchor="middle" font-size="8" fill="#aaa">via WhatsApp</text>

  <!-- Connector 1→2 -->
  <line x1="80" y1="82" x2="122" y2="82" stroke="#027E5D" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="101" y="76" text-anchor="middle" font-size="7.5" fill="#027E5D">webhook</text>

  <!-- 2. Backend processes -->
  <rect x="124" y="62" width="100" height="40" rx="8" fill="#014533" filter="url(#s)"/>
  <text x="174" y="78" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">Backend</text>
  <text x="174" y="91" text-anchor="middle" font-size="8" fill="rgba(255,255,255,.8)">Dedup · onboarding</text>
  <text x="174" y="114" text-anchor="middle" font-size="8.5" fill="#555">Validates &amp; routes</text>
  <text x="174" y="126" text-anchor="middle" font-size="8" fill="#aaa">FastAPI</text>

  <!-- Connector 2→3 -->
  <line x1="226" y1="82" x2="266" y2="82" stroke="#027E5D" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="246" y="76" text-anchor="middle" font-size="7.5" fill="#027E5D">async job</text>

  <!-- 3. AI Service -->
  <rect x="268" y="62" width="100" height="40" rx="8" fill="#2d6a4f" filter="url(#s)"/>
  <text x="318" y="78" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">Akvo RAG</text>
  <text x="318" y="91" text-anchor="middle" font-size="8" fill="rgba(255,255,255,.8)">KB query + LLM</text>
  <text x="318" y="114" text-anchor="middle" font-size="8.5" fill="#555">Generates answer</text>
  <text x="318" y="126" text-anchor="middle" font-size="8" fill="#aaa">external AI</text>

  <!-- Connector 3→4 -->
  <line x1="370" y1="82" x2="408" y2="82" stroke="#35987D" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#a3)"/>
  <text x="389" y="76" text-anchor="middle" font-size="7.5" fill="#35987D">callback</text>

  <!-- 4. Backend delivers -->
  <rect x="410" y="62" width="100" height="40" rx="8" fill="#015942" filter="url(#s)"/>
  <text x="460" y="78" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">Backend</text>
  <text x="460" y="91" text-anchor="middle" font-size="8" fill="rgba(255,255,255,.8)">Stores + delivers</text>
  <text x="460" y="114" text-anchor="middle" font-size="8.5" fill="#555">Sends via Twilio</text>
  <text x="460" y="126" text-anchor="middle" font-size="8" fill="#aaa">WhatsApp out</text>

  <!-- Connector 4→5 -->
  <line x1="512" y1="82" x2="552" y2="82" stroke="#027E5D" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="532" y="76" text-anchor="middle" font-size="7.5" fill="#027E5D">reply</text>

  <!-- 5. Farmer receives -->
  <circle cx="576" cy="82" r="20" fill="#027E5D" filter="url(#s)"/>
  <text x="576" y="78" text-anchor="middle" font-size="14">💬</text>
  <text x="576" y="91" text-anchor="middle" font-size="8" fill="#fff" font-weight="700">Answer</text>
  <text x="576" y="114" text-anchor="middle" font-size="8.5" fill="#555">Farmer reads reply</text>
  <text x="576" y="126" text-anchor="middle" font-size="8" fill="#aaa">+ escalate option</text>

  <!-- Divider -->
  <line x1="0" y1="142" x2="664" y2="142" stroke="#E6F2EF" stroke-width="1.5"/>

  <!-- ════════════════════════════════════════
       FLOW 2 — ESCALATION
  ════════════════════════════════════════ -->
  <rect x="0" y="148" width="664" height="30" rx="8" fill="#014533"/>
  <text x="16" y="167" font-size="10" font-weight="700" fill="#fff" letter-spacing=".3">FLOW B  ·  Farmer Escalation → Extension Officer Reply</text>

  <!-- 1. Farmer escalates -->
  <circle cx="58" cy="230" r="20" fill="#027E5D" filter="url(#s)"/>
  <text x="58" y="226" text-anchor="middle" font-size="14">🆘</text>
  <text x="58" y="239" text-anchor="middle" font-size="8" fill="#fff" font-weight="700">Escalate</text>
  <text x="58" y="262" text-anchor="middle" font-size="8.5" fill="#555">Taps "Talk to</text>
  <text x="58" y="274" text-anchor="middle" font-size="8.5" fill="#555">an expert"</text>

  <!-- Connector 1→2 -->
  <line x1="80" y1="230" x2="122" y2="230" stroke="#027E5D" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="101" y="224" text-anchor="middle" font-size="7.5" fill="#027E5D">button tap</text>

  <!-- 2. Backend creates ticket + whisper -->
  <rect x="124" y="210" width="100" height="40" rx="8" fill="#014533" filter="url(#s)"/>
  <text x="174" y="226" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">Create Ticket</text>
  <text x="174" y="239" text-anchor="middle" font-size="8" fill="rgba(255,255,255,.8)">+ queue Whisper</text>
  <text x="174" y="262" text-anchor="middle" font-size="8.5" fill="#555">Ticket assigned</text>
  <text x="174" y="274" text-anchor="middle" font-size="8" fill="#aaa">to ward</text>

  <!-- Connector 2→3 -->
  <line x1="226" y1="230" x2="266" y2="230" stroke="#027E5D" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="246" y="224" text-anchor="middle" font-size="7.5" fill="#027E5D">AI job</text>

  <!-- 3. AI generates whisper -->
  <rect x="268" y="210" width="100" height="40" rx="8" fill="#2d6a4f" filter="url(#s)"/>
  <text x="318" y="226" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">AI Whisper</text>
  <text x="318" y="239" text-anchor="middle" font-size="8" fill="rgba(255,255,255,.8)">EO suggestion</text>
  <text x="318" y="262" text-anchor="middle" font-size="8.5" fill="#555">Private hint for</text>
  <text x="318" y="274" text-anchor="middle" font-size="8" fill="#aaa">the officer</text>

  <!-- Connector 3→4 -->
  <line x1="370" y1="230" x2="408" y2="230" stroke="#027E5D" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="389" y="224" text-anchor="middle" font-size="7.5" fill="#027E5D">notify</text>

  <!-- 4. EO receives + replies -->
  <rect x="410" y="210" width="100" height="40" rx="8" fill="#015942" filter="url(#s)"/>
  <text x="460" y="226" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">EO Replies</text>
  <text x="460" y="239" text-anchor="middle" font-size="8" fill="rgba(255,255,255,.8)">Push + Socket.IO</text>
  <text x="460" y="262" text-anchor="middle" font-size="8.5" fill="#555">Reads whisper,</text>
  <text x="460" y="274" text-anchor="middle" font-size="8" fill="#aaa">types reply</text>

  <!-- Connector 4→5 -->
  <line x1="512" y1="230" x2="552" y2="230" stroke="#027E5D" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="532" y="224" text-anchor="middle" font-size="7.5" fill="#027E5D">WhatsApp</text>

  <!-- 5. Farmer gets help -->
  <circle cx="576" cy="230" r="20" fill="#027E5D" filter="url(#s)"/>
  <text x="576" y="226" text-anchor="middle" font-size="14">✅</text>
  <text x="576" y="239" text-anchor="middle" font-size="8" fill="#fff" font-weight="700">Resolved</text>
  <text x="576" y="262" text-anchor="middle" font-size="8.5" fill="#555">Farmer reads</text>
  <text x="576" y="274" text-anchor="middle" font-size="8" fill="#aaa">expert reply</text>

  <!-- Divider -->
  <line x1="0" y1="290" x2="664" y2="290" stroke="#E6F2EF" stroke-width="1.5"/>

  <!-- ════════════════════════════════════════
       FLOW 3 — BROADCAST (compact horizontal)
  ════════════════════════════════════════ -->
  <rect x="0" y="295" width="664" height="26" rx="8" fill="#35987D"/>
  <text x="16" y="312" font-size="10" font-weight="700" fill="#fff" letter-spacing=".3">FLOW C  ·  Broadcast &amp; Weather Advisory  →  Delivered to all subscribers</text>

  <!-- Four steps in a row -->
  <!-- Step 1 -->
  <rect x="8" y="328" width="134" height="42" rx="8" fill="#014533" filter="url(#s)"/>
  <text x="75" y="345" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">Admin / EO</text>
  <text x="75" y="358" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,.8)">Creates broadcast</text>

  <line x1="144" y1="349" x2="162" y2="349" stroke="#027E5D" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Step 2 -->
  <rect x="164" y="328" width="144" height="42" rx="8" fill="#027E5D" filter="url(#s)"/>
  <text x="236" y="345" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">Confirmation Template</text>

  <line x1="310" y1="349" x2="328" y2="349" stroke="#027E5D" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Step 3 -->
  <rect x="330" y="328" width="154" height="42" rx="8" fill="#015942" filter="url(#s)"/>
  <text x="407" y="345" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">Actual Message Sent</text>
  <text x="407" y="358" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,.8)">Broadcast or weather advisory</text>

  <line x1="486" y1="349" x2="504" y2="349" stroke="#027E5D" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Step 4 -->
  <rect x="506" y="328" width="150" height="42" rx="8" fill="#35987D" filter="url(#s)"/>
  <text x="581" y="345" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">Delivery Tracked</text>
  <text x="581" y="358" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,.8)">Per-recipient status</text>
</svg>
</div>

</body>
</html>
