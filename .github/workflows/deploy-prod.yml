name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-to-production
  cancel-in-progress: false

# Production deploy reuses the container image already built and tested by the
# "Deploy to Test Cluster" pipeline (which runs on every push to main). Instead
# of re-running tests and rebuilding/pushing images, we retag the existing
# test-built image (main.<sha>) to the production tags and roll it out.
# The agriconnect2 images are environment-agnostic: no domain/env is baked at
# build time (frontend does not read WEBDOMAIN/NEXT_PUBLIC_*, nginx uses
# server_name _ and internal upstreams, backend/celery read config at runtime
# from the Vault-injected Secret), so the test image is byte-identical to what a
# production rebuild would produce. Production ENV is applied at runtime by the
# production k8s manifests + Secret.

jobs:
  check-app-changes:
    name: Check for App Changes
    runs-on: ubuntu-latest
    outputs:
      app-changed: ${{ steps.check.outputs.app }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for app changes
        id: check
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            # For releases, compare against previous tag
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              CHANGED=$(git diff --name-only "$PREV_TAG" HEAD -- app/ | wc -l)
            else
              # No previous tag, assume changes exist
              CHANGED=1
            fi
            echo "app=$([[ $CHANGED -gt 0 ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          else
            # For workflow_dispatch, always build
            echo "app=true" >> $GITHUB_OUTPUT
          fi

  promote:
    name: Promote Tested Image to Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Akvo composite actions
        uses: actions/checkout@v4
        with:
          repository: akvo/composite-actions
          token: ${{ secrets.GH_PAT }}
          path: composite-actions
          ref: 0.0.11

      # Retag the image already built and tested by the "Deploy to Test Cluster"
      # pipeline (main.<sha>) to the production tags. add-tag only moves manifest
      # pointers (no rebuild) and fails loudly if the tested image is absent for
      # this commit. version-tag recreates <ref>.<sha> so the rollout job finds it.
      - name: Promote tested image to production
        uses: ./composite-actions/.github/actions/promote
        with:
          app-name: "agriconnect2"
          services: "nginx frontend backend celery-worker celery-beat"
          source-tag: "main.${{ github.sha }}"
          version-tag: "${{ github.ref_name }}.${{ github.sha }}"
          cluster-name: "production"
          gcloud-sa: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_REGISTRY }}

  build-mobile:
    name: Build Mobile App (APK)
    runs-on: ubuntu-latest
    environment: Production
    needs: [check-app-changes, promote]
    if: needs.check-app-changes.outputs.app-changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "yarn"
          cache-dependency-path: app/yarn.lock

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: app
        run: yarn install --frozen-lockfile

      - name: Build Android APK
        working-directory: app
        run: |
          eas build --platform android --profile production --non-interactive 2>&1 | tee output.txt
          BUILD_ID=$(grep -oP '(?<=builds/)[a-f0-9-]+' output.txt | tail -1)
          APK_URL=$(eas build:view "$BUILD_ID" --json 2>/dev/null | jq -r '.artifacts.buildUrl')
          echo "APK_URL=$APK_URL" >> "$GITHUB_ENV"

      - name: Get app version
        run: |
          VERSION=$(node -e "const c = require('./app/app.config.js'); console.log(c.expo.version)")
          echo "APK_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download APK
        run: curl -L -o agriconnect.apk "$APK_URL"

      - name: Upload APK to storage
        run: |
          curl -X POST \
            -H "X-Storage-Secret: ${{ secrets.STORAGE_SECRET }}" \
            -F "file=@agriconnect.apk" \
            -F "filename=agriconnect-${APK_VERSION}.apk" \
            ${{ secrets.STORAGE_UPLOAD_URL }}

  rollout:
    name: Rollout to the server
    needs: [promote]
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout Akvo composite actions
        uses: actions/checkout@v4
        with:
          repository: akvo/composite-actions
          token: ${{ secrets.GH_PAT }}
          path: composite-actions
          ref: 0.0.10

      - name: Rollout Nginx
        uses: ./composite-actions/.github/actions/k8s-rollout
        with:
          app-name: "agriconnect2"
          deployment-name: "nginx-deployment"
          container-name: "nginx"
          cluster-name: "production"
          namespace-name: "agriconnect2-namespace"
          gcloud-sa: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_K8S }}

      - name: Rollout Backend
        uses: ./composite-actions/.github/actions/k8s-rollout
        with:
          app-name: "agriconnect2"
          deployment-name: "backend-deployment"
          container-name: "backend"
          cluster-name: "production"
          namespace-name: "agriconnect2-namespace"
          gcloud-sa: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_K8S }}

      - name: Rollout Celery Worker
        uses: ./composite-actions/.github/actions/k8s-rollout
        with:
          app-name: "agriconnect2"
          deployment-name: "celery-worker-deployment"
          container-name: "celery-worker"
          cluster-name: "production"
          namespace-name: "agriconnect2-namespace"
          gcloud-sa: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_K8S }}

      - name: Rollout Celery Beat
        uses: ./composite-actions/.github/actions/k8s-rollout
        with:
          app-name: "agriconnect2"
          deployment-name: "celery-beat-deployment"
          container-name: "celery-beat"
          cluster-name: "production"
          namespace-name: "agriconnect2-namespace"
          gcloud-sa: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_K8S }}

      - name: Rollout Frontend
        uses: ./composite-actions/.github/actions/k8s-rollout
        with:
          app-name: "agriconnect2"
          deployment-name: "frontend-deployment"
          container-name: "frontend"
          cluster-name: "production"
          namespace-name: "agriconnect2-namespace"
          gcloud-sa: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_K8S }}
